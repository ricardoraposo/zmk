CONFIG_USB_DEVICE_PRODUCT="Keychron B1 Pro"
CONFIG_BT_DIS_MODEL="Keychron B1 pro"
CONFIG_ZMK_KEYBOARD_NAME="Keychron B1 Pro"

CONFIG_USB_DEVICE_VID=0x3434
CONFIG_USB_DEVICE_PID=0x071a
CONFIG_BT_DIS_PNP_VID=0x3434
CONFIG_BT_DIS_PNP_PID=0x071a
CONFIG_BT_DIS_PNP_VER=0x0102
CONFIG_BT_DIS_FW_REV_STR="v1.0.2"
CONFIG_BT_DIS_HW_REV_STR="v1.0.1"
CONFIG_BT_DIS_SERIAL_NUMBER_STR="SN2024040814230078"

CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=5
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=8

# # debug
# CONFIG_ZMK_UART_LOGGING=y

# Bluetooth settings recovered by comparing a build of this source against the factory
# v1.0.2 image of a B1 Pro (PID 0x071a). The factory firmware uses them, the public
# defaults do not.
CONFIG_BT_LL_SW_LLCP_LEGACY=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
